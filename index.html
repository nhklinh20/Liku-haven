const REV={};Object.entries(I18N).forEach(([vi,arr])=>arr.forEach(t=>{if(t&&!REV[t])REV[t]=vi}));
const RXT=[
 {vi:'Đã đọc {0}%',en:'Read {0}%',th:'อ่านแล้ว {0}%',zh:'已读 {0}%',ko:'{0}% 읽음',ja:'{0}% 読了'},
 {vi:'Trang {0} / {1}',en:'Page {0} / {1}',th:'หน้า {0} / {1}',zh:'第 {0} / {1} 页',ko:'{0} / {1} 페이지',ja:'{0} / {1} ページ'},
 {vi:'{0} phút trước',en:'{0} min ago',th:'{0} นาทีที่แล้ว',zh:'{0} 分钟前',ko:'{0}분 전',ja:'{0}分前'},
 {vi:'{0} giờ trước',en:'{0} h ago',th:'{0} ชั่วโมงที่แล้ว',zh:'{0} 小时前',ko:'{0}시간 전',ja:'{0}時間前'},
 {vi:'{0} ngày trước',en:'{0} days ago',th:'{0} วันที่แล้ว',zh:'{0} 天前',ko:'{0}일 전',ja:'{0}日前'}];
const rxOf=t=>new RegExp('^'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\\\{(\d)\\\}/g,'(.+?)')+'$');
RXT.forEach(r=>r.re=Object.fromEntries(LANGS.map(l=>[l,rxOf(r[l])])));
let lang='vi';try{const L=localStorage.getItem('liku.lang')||localStorage.getItem('sochitieu.lang')||localStorage.getItem('liku_lang');
  if(LANGS.includes(L))lang=L;else{const n=String(navigator.language||'vi').slice(0,2).toLowerCase();if(LANGS.includes(n))lang=n}}catch(e){}
function tr(k){
  const base=I18N[k]?k:REV[k];
  if(base)return lang==='vi'?base:I18N[base][LANGS.indexOf(lang)-1]||k;
  for(const r of RXT)for(const l of LANGS){const m=k.match(r.re[l]);if(m){let out=r[lang];m.slice(1).forEach((v,i)=>out=out.replace('{'+i+'}',v));return out}}
  return k}
function trNode(root){
  const doText=n=>{const s=n.nodeValue,k=s.trim();if(k){const r=tr(k);if(r!==k)n.nodeValue=s.replace(k,r)}};
  const doEl=n=>{if(n.placeholder){const r=tr(n.placeholder);if(r!==n.placeholder)n.placeholder=r}const al=n.getAttribute&&n.getAttribute('aria-label');if(al){const r=tr(al);if(r!==al)n.setAttribute('aria-label',r)}};
  if(root.nodeType===3)return doText(root);if(root.nodeType!==1||root.tagName==='SCRIPT'||root.tagName==='STYLE')return;
  doEl(root);const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3){const p=n.parentNode;if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'))continue;doText(n)}else doEl(n)}
}
function setLang(l){lang=LANGS.includes(l)?l:'vi';try{localStorage.setItem('liku.lang',lang);localStorage.setItem('sochitieu.lang',lang)}catch(e){}document.documentElement.lang=lang;const ls=$('#langSel');if(ls)ls.value=lang;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));if(typeof tickRoom==='function')tickRoom();trNode(document.body);document.title="Liku Haven"}
new MutationObserver(ms=>{if(lang==='vi')return;ms.forEach(m=>m.addedNodes.forEach(trNode))}).observe(document.body,{childList:true,subtree:true});
$('#langSel').value=lang;$('#langSel').onchange=e=>setLang(e.target.value);
if(lang!=='vi')setLang(lang);


const room=document.querySelector('svg.room');
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.querySelector('.scene').addEventListener('pointermove',e=>{const r=room.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;room.style.setProperty('--ry',(x*7).toFixed(2)+'deg');room.style.setProperty('--rx',(-y*5).toFixed(2)+'deg')});
  document.querySelector('.scene').addEventListener('pointerleave',()=>{room.style.setProperty('--ry','0deg');room.style.setProperty('--rx','0deg')});
}
function renderLamp(){
  const on=!document.body.classList.contains('night');
  body.innerHTML=`<div class="tools"><button id="tg">${on?'Tắt đèn chính (chỉ để LED)':'Bật đèn'}</button><button id="pomo">Bắt đầu Pomodoro 25 phút</button><button id="pomoT">Thử 10 giây</button><span class="amt" id="tm"></span></div><p class="note-sample">Đèn điều khiển độ sáng cả phòng và hẹn giờ tập trung.</p>`;
  $('#tg').onclick=()=>{document.body.classList.toggle('night');renderLamp()};
  const startP=sec=>{let s=sec;clearInterval(window._p);window._p=setInterval(()=>{s--;const t=$('#tm');if(t)t.textContent=`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(s<=0){clearInterval(window._p);water=Math.min(8,water+1);notify('pomodoro','Pomodoro xong rồi!','Nghỉ 5 phút nhé. Cây trong vườn vừa được tưới.','garden');award(3,'Hoàn thành 1 phiên Pomodoro','pomodoros')}},1000)};
  $('#pomo').onclick=()=>startP(1500);$('#pomoT').onclick=()=>startP(10);
}
